name: Container supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-build-scan-sbom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: wallet-api
            context: .
            dockerfile: services/api-adapter-service/Dockerfile
          - component: voice-verification
            context: services/voice-service
            dockerfile: services/voice-service/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "${{ matrix.context }}"
          file: "${{ matrix.dockerfile }}"
          load: true
          push: false
          tags: "voicesecure/${{ matrix.component }}:ci"
          provenance: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "voicesecure/${{ matrix.component }}:ci"
          format: sarif
          output: "${{ matrix.component }}-trivy.sarif"
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: "voicesecure/${{ matrix.component }}:ci"
          format: cyclonedx-json
          output-file: "${{ matrix.component }}.cdx.json"
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ matrix.component }}-supply-chain-evidence"
          path: |
            ${{ matrix.component }}.cdx.json
            ${{ matrix.component }}-trivy.sarif

  publish-by-digest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - component: wallet-api
            context: .
            dockerfile: services/api-adapter-service/Dockerfile
          - component: voice-verification
            context: services/voice-service
            dockerfile: services/voice-service/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "${{ matrix.context }}"
          file: "${{ matrix.dockerfile }}"
          push: true
          tags: "${{ steps.image.outputs.name }}:${{ github.sha }}"
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: "${{ steps.image.outputs.name }}"
          subject-digest: "${{ steps.build.outputs.digest }}"
          push-to-registry: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - env:
          IMAGE: "${{ steps.image.outputs.name }}"
          DIGEST: "${{ steps.build.outputs.digest }}"
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
