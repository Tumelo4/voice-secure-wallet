name: Staging frontend deployment

on:
  workflow_run:
    workflows:
      - Staging backend deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-frontend-deployment
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  AWS_DEFAULT_REGION: af-south-1
  EXPECTED_AWS_ACCOUNT_ID: "296032707614"
  TERRAFORM_DIR: infra/aws/environments/staging

jobs:
  deploy:
    name: Build and deploy integrated web frontend
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ steps.target.outputs.application-url }}

    steps:
      - name: Resolve backend revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out backend-tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.13.0"
          terraform_wrapper: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::296032707614:role/voice-secure-wallet
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: voicesecure-staging-frontend-${{ github.run_id }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}

      - name: Read the Terraform deployment contract
        id: target
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
          terraform -chdir="$TERRAFORM_DIR" init -input=false

          bucket="$(terraform -chdir="$TERRAFORM_DIR" output -raw frontend_bucket_name)"
          distribution_id="$(terraform -chdir="$TERRAFORM_DIR" output -raw frontend_distribution_id)"
          application_url="$(terraform -chdir="$TERRAFORM_DIR" output -raw application_base_url)"

          test -n "$bucket"
          test -n "$distribution_id"
          [[ "$application_url" == https://* ]]
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution-id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "application-url=$application_url" >> "$GITHUB_OUTPUT"

      - name: Install, test, and export frontend
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ steps.target.outputs.application-url }}
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run validate
          npx expo export --platform web --output-dir dist

      - name: Publish frontend and invalidate CloudFront
        shell: bash
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
          DISTRIBUTION_ID: ${{ steps.target.outputs.distribution-id }}
        run: |
          set -euo pipefail
          aws s3 sync apps/mobile/dist "s3://${BUCKET}" --delete --only-show-errors
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Verify frontend and backend integration
        env:
          APPLICATION_URL: ${{ steps.target.outputs.application-url }}
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors --silent --show-error "$APPLICATION_URL/" >/dev/null
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors \
            --header 'X-Trace-Id: staging-frontend-integration-ready' \
            --silent --show-error "$APPLICATION_URL/health/ready" >/dev/null

      - name: Deployment summary
        env:
          APPLICATION_URL: ${{ steps.target.outputs.application-url }}
          COMMIT_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          {
            echo "## Staging frontend deployment"
            echo
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Integrated application: \`$APPLICATION_URL\`"
            echo "- API routing: \`${APPLICATION_URL}/v1/*\`"
          } >> "$GITHUB_STEP_SUMMARY"
